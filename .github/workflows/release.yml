name: release

# 태그를 밀면 맥·윈도우 설치파일이 같이 만들어진다
#   git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:          # 수동 실행도 가능

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon 전용
            args: '--target aarch64-apple-darwin'
          - platform: windows-latest    # .msi + .exe(NSIS)
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '코인주라 위젯 ${{ github.ref_name }}'
          releaseDraft: false   # 초안이면 외부에서 다운로드가 안 된다
          prerelease: false
          args: ${{ matrix.args }}

      # 코인주라에 걸 다운로드 링크가 버전마다 바뀌지 않도록 고정 이름 사본을 함께 올린다.
      # 실패해도 버전이 붙은 원본 자산은 이미 올라가 있으므로 릴리스를 막지 않는다.
      - name: 고정 이름 자산 추가
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          # 파일 이름에 공백이 있다("Coinjura Widget_...exe"). $(find) 를 그냥 돌리면
          # 공백에서 쪼개져 경로가 깨지므로 널 구분자로 읽는다.
          while IFS= read -r -d '' f; do
            case "$f" in
              *.dmg)       cp "$f" coinjura-widget-mac.dmg ;;
              *-setup.exe) cp "$f" coinjura-widget-win-setup.exe ;;
            esac
          done < <(find src-tauri/target \( -name '*.dmg' -o -name '*-setup.exe' \) -print0)
          for f in coinjura-widget-mac.dmg coinjura-widget-win-setup.exe; do
            if [ -f "$f" ]; then
              echo "올림: $f"
              gh release upload "$tag" "$f" --clobber
            fi
          done
