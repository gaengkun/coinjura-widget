name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            alias: coinjura-widget-mac.dmg
            msi_alias: ''
          - platform: windows-latest
            args: ''
            alias: coinjura-widget-win-setup.exe
            msi_alias: coinjura-widget-win.msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 태그와 앱 버전 일치 확인
        shell: bash
        run: node -e 'const c=require("./src-tauri/tauri.conf.json"); if(process.env.GITHUB_REF_NAME !== "v"+c.version) process.exit(1)'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: npm run tauri build -- ${{ matrix.args }}
      - name: 설치 파일 검증 및 고정 이름 준비
        shell: bash
        env:
          CJ_RELEASE_ALIAS: ${{ matrix.alias }}
          CJ_MSI_ALIAS: ${{ matrix.msi_alias }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          count=0
          msi_count=0
          while IFS= read -r -d '' f; do
            case "$f" in
              *.dmg)
                bash scripts/verify-macos-dmg.sh "$f" "${GITHUB_REF_NAME#v}"
                cp "$f" "release-assets/$CJ_RELEASE_ALIAS"
                count=$((count + 1))
                ;;
              *-setup.exe)
                test -s "$f"
                cp "$f" "release-assets/$CJ_RELEASE_ALIAS"
                count=$((count + 1))
                ;;
              *.msi)
                test -s "$f"
                if [ -n "${CJ_MSI_ALIAS:-}" ]; then
                  cp "$f" "release-assets/$CJ_MSI_ALIAS"
                  msi_count=$((msi_count + 1))
                fi
                ;;
            esac
            cp "$f" release-assets/
          done < <(find src-tauri/target -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' \) -print0)
          test "$count" -eq 1
          test -s "release-assets/$CJ_RELEASE_ALIAS"
          if [ -n "${CJ_MSI_ALIAS:-}" ]; then
            test "$msi_count" -eq 1
            test -s "release-assets/$CJ_MSI_ALIAS"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: 양쪽 설치 파일 준비 후 공개
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-assets
          test -s coinjura-widget-mac.dmg
          test -s coinjura-widget-win-setup.exe
          test -s coinjura-widget-win.msi
          sha256sum -- * > SHA256SUMS.txt
          # 모든 자산 업로드가 성공한 뒤에만 latest로 공개한다.
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "코인주라 위젯 $GITHUB_REF_NAME" \
            --notes-file ../docs/release-notes.md -- ./*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
