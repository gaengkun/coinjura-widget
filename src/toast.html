<meta charset="UTF-8">
<title>알림</title>
<style>
  :root{
    --card:#141822; --tx:#e6ebf3; --tx2:#828c9f; --accent:#f7a600; --accent-tx:#f7a600;
    --up:#e5484d; --down:#3d7bf6;
    --sans:"Malgun Gothic","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  [data-theme="light"]{
    --card:#f5f6f8; --tx:#12151b; --tx2:#5c6573; --accent-tx:#a06a00;
    --up:#d92d39; --down:#1f66e0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;height:100%;overflow:hidden;cursor:grab;
    font-family:var(--sans);font-size:12px;line-height:1.5;-webkit-font-smoothing:antialiased;user-select:none;cursor:pointer}

  /* 알림 투명도 적용을 켜면 위젯 설정을 따른다. 나타나고 사라지는 건 JS 가 transition 으로
     몰기 때문에 여기서는 초기 상태(안 보임)만 잡아둔다. */
  .bar{height:100%;display:flex;flex-direction:column;gap:2px;overflow-y:auto;
    background:var(--card);border:0;border-radius:10px;
    padding:6px 14px 6px;box-shadow:0 8px 22px -8px rgba(0,0,0,.6);
    opacity:0}

  /* 거래소별 한 줄. 행 23px + 간격 2px을 Rust 창 높이에도 반영한다. */
  .ln{display:flex;align-items:center;min-height:23px;padding:2px 0;flex:none;color:var(--tx)}
  .ln+.ln{border-top:1px solid color-mix(in srgb,var(--tx2) 20%,transparent)}
  .cj-toast-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:18px}
  .cj-toast-head{width:100%}
  .cg.cj-toast-old{font-size:12px;font-weight:400;color:var(--tx2)}
  .cj-toast-metrics{display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap}
  .cj-toast-sep{color:var(--tx2);opacity:.2;font-size:12px;flex:none}
  .cj-toast-ex{font-size:10px;font-weight:700;line-height:1;padding:3px 5px;
    border-radius:4px;white-space:nowrap;flex:none;color:var(--tx);background:var(--card)}
  .cj-toast-ex[data-exchange="업비트"]{background:#3d5afe;color:#fff}
  .cj-toast-ex[data-exchange="빗썸"]{background:#f7a600;color:#1a1400}
  .cj-toast-ex[data-exchange="바이낸스"]{background:#f0b90b;color:#1a1400}
  .cj-toast-ex[data-exchange="바이비트"]{background:#ff7a45;color:#1a0d00}
  .nmw{display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 auto}
  .tkr{font-weight:700;font-size:13px;flex:none}
  .nm{font-size:12px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .px{font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
  .cg{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
  .kp{flex:none;text-align:right;font-variant-numeric:tabular-nums;font-size:11px;font-weight:400;color:var(--tx2)}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--tx2)}
  .cj-toast-resize{position:absolute;right:2px;bottom:2px;width:14px;height:14px;z-index:1;
    border:0;background:transparent;color:var(--tx2);cursor:nwse-resize;touch-action:none;
    font-size:9px;line-height:14px;text-align:right;opacity:0;pointer-events:none}
  .cj-toast-resize:focus-visible{outline:1px solid var(--accent-tx)}
</style>

<div class="bar" id="bar"></div>
<button type="button" class="cj-toast-resize" id="cjToastResize" aria-label="알림창 크기 조절" title="끌어서 크기 조절 · 방향키로 조절">◢</button>

<script>
  const T=window.__TAURI__;
  const bar=()=>document.getElementById("bar");
  const IN_MS=280, OUT_MS=200;
  let durationMs=3000;
  let fadeT=null, toastSeq=0;

  // 위젯 창과 같은 출처라 테마·투명도 설정을 그대로 읽는다.
  function readUi(){
    try{ return JSON.parse(localStorage.getItem("cj_widget_ui"))||{}; }catch(e){ return {}; }
  }
  function applyTheme(u){
    document.documentElement.dataset.theme = (u.theme==="light") ? "light" : "dark";
  }
  function targetOpa(u){
    if(u.toastOpa===false) return 1;
    const v = (typeof u.opa==="number") ? u.opa : 100;
    return Math.max(5, Math.min(100, v)) / 100;   // 위젯과 같은 하한 5%
  }
  applyTheme(readUi());

  /* 누르면 닫고, 끌면 옮긴다.
     둘 다 같은 마우스 조작이라 움직인 거리로 가른다. 4px 안쪽이면 클릭이다.
     옮긴 자리는 저장해서 다음 알림부터 그 자리에 뜬다. */
  const SLOP=4;
  let base={x:0,y:0}, drag=null;
  const TW=T&&T.window;

  function closeNow(){
    toastSeq++;
    clearTimeout(fadeT);
    const b=bar();
    b.style.transition="none";
    b.style.opacity="0";
    cjGripVisible(false);
    try{ T && T.core && T.core.invoke("hide_toast"); }catch(e){}
  }
  function savePos(x,y){
    try{ localStorage.setItem("cj_widget_toastpos", JSON.stringify({x,y})); }catch(e){}
  }
  function cjToastSize(){
    try{
      const size=JSON.parse(localStorage.getItem("cj_widget_toastsize"));
      return size && Number.isFinite(size.width) && size.width>=240 &&
        Number.isFinite(size.height) && size.height>=54 ? size : null;
    }catch(e){return null;}
  }
  function cjHoldToast(active){
    clearTimeout(fadeT);
    try{T && T.core && T.core.invoke("hold_toast",{active,durationSeconds:durationMs/1000}).catch(()=>{});}catch(e){}
  }
  let cjResize=null, cjResizeNext=null, cjResizeWork=null;
  let cjToastBounds={width:1920,height:1080};
  const cjGrip=document.getElementById("cjToastResize");
  function cjGripVisible(visible){
    if(!cjGrip) return;
    cjGrip.style.opacity=visible?String(targetOpa(readUi())):"0";
    cjGrip.style.pointerEvents=visible?"auto":"none";
  }
  function cjResizeTo(width,height){
    if(!TW) return Promise.resolve();
    cjResizeNext={width:Math.round(Math.min(Math.max(240,width),cjToastBounds.width)),
      height:Math.round(Math.min(Math.max(54,height),cjToastBounds.height))};
    if(!cjResizeWork){
      cjResizeWork=(async()=>{
        while(cjResizeNext){
          const size=cjResizeNext; cjResizeNext=null;
          await TW.getCurrentWindow().setSize(new TW.LogicalSize(size.width,size.height));
          try{localStorage.setItem("cj_widget_toastsize",JSON.stringify(size));}catch(e){}
        }
      })().catch(()=>{cjResizeNext=null;}).finally(()=>{cjResizeWork=null;});
    }
    return cjResizeWork;
  }
  async function cjFinishResize(){
    if(!cjResize) return;
    cjResize=null;
    await cjResizeWork;
    await cjFitToast();
    cjHoldToast(false); armFade();
  }
  if(cjGrip){
    cjGrip.addEventListener("pointerdown",e=>{
      if(e.button!==0 || !TW) return;
      e.preventDefault();e.stopPropagation();
      cjGrip.setPointerCapture(e.pointerId);
      cjResize={x:e.screenX,y:e.screenY,width:window.innerWidth,height:window.innerHeight};
      cjHoldToast(true);
    });
    cjGrip.addEventListener("pointermove",e=>{
      if(cjResize) cjResizeTo(cjResize.width+e.screenX-cjResize.x,cjResize.height+e.screenY-cjResize.y);
    });
    for(const name of ["pointerup","pointercancel","lostpointercapture"]) cjGrip.addEventListener(name,cjFinishResize);
    cjGrip.addEventListener("keydown",async e=>{
      const step={ArrowLeft:[-16,0],ArrowRight:[16,0],ArrowUp:[0,-16],ArrowDown:[0,16]}[e.key];
      if(!step || !TW) return;
      e.preventDefault();e.stopPropagation();cjHoldToast(true);
      await cjResizeTo(window.innerWidth+step[0],window.innerHeight+step[1]);
      await cjFitToast();cjHoldToast(false);armFade();
    });
  }

  document.addEventListener("mousedown",e=>{
    if(e.button!==0 || (e.target && e.target.closest(".cj-toast-resize"))) return;
    e.preventDefault();
    drag={sx:e.screenX, sy:e.screenY, ox:base.x, oy:base.y, moved:false};
    clearTimeout(fadeT);                 // 옮기는 동안에는 사라지지 않게
    cjHoldToast(true);
    const b=bar();
    b.style.transition="none";
    b.style.opacity=String(targetOpa(readUi()));
  });
  window.addEventListener("mousemove",e=>{
    if(!drag) return;
    const dx=e.screenX-drag.sx, dy=e.screenY-drag.sy;
    if(!drag.moved && Math.abs(dx)<=SLOP && Math.abs(dy)<=SLOP) return;
    drag.moved=true;
    base.x=drag.ox+dx; base.y=drag.oy+dy;
    if(TW){ try{ TW.getCurrentWindow().setPosition(new TW.LogicalPosition(base.x,base.y)); }catch(err){} }
  });
  window.addEventListener("mouseup",()=>{
    const d=drag; drag=null;
    if(!d) return;
    if(d.moved){ savePos(base.x,base.y); cjHoldToast(false); armFade(); }   // 옮겼다 → 자리 기억
    else closeNow();                                    // 안 움직였다 → 닫기
  });

  /* ① Rust 가 창을 띄우기 전에 부른다 — 내용만 채우고 안 보이는 상태로 대기 */
  function cell(tag,cls,text){
    const el=document.createElement(tag); el.className=cls;
    el.textContent=text==null?"":String(text); return el;
  }
  function cjToastSeparator(){
    const separator=cell("span","cj-toast-sep","|");
    separator.setAttribute("aria-hidden","true");
    return separator;
  }
  window.__cjToast=function(lines,cols,durationSeconds=3){
    toastSeq++;
    durationMs=(Number.isInteger(durationSeconds) && durationSeconds>=1 && durationSeconds<=86400 ? durationSeconds : 3)*1000;
    const u=readUi();
    applyTheme(u);
    const list=Array.isArray(lines)?lines:[lines];
    const cs=(Array.isArray(cols)&&cols.length)?cols:["tkr","chg"];
    const b=bar();
    b.innerHTML="";
    for(const it of list){
      const row=document.createElement("div");
      row.className="ln";
      const exchange=cell("span","cj-toast-ex",it.exchangeShort||it.exchange||"거래소");
      exchange.dataset.exchange=it.exchange||"";
      exchange.title=it.exchange||"거래소";
      const w=document.createElement("div"); w.className="nmw";
      if(cs.includes("tkr"))  w.appendChild(cell("span","tkr",it.sym));
      if(cs.includes("name")) w.appendChild(cell("span","nm",it.name));
      w.appendChild(exchange);
      const head=cell("div","cj-toast-head",""); head.appendChild(w);
      if(cs.includes("price")){
        const price=cell("div","px",it.px||"—");
        price.title="현재 가격"; head.appendChild(price);
      }
      if(cs.includes("chg")){
        const rates=cell("div","cj-toast-metrics","");
        rates.appendChild(cjToastSeparator());
        const before=Number.isFinite(it.beforeRate)?it.beforeRate:null;
        const baseline=cell("div","cg cj-toast-old",before===null?"—":(before>0?"+":"")+Number(before.toFixed(2))+"%");
        baseline.title=(it.beforeLabel||"이전")+" 거래소 변동률 · 현재 "+(it.chg||"—");
        rates.appendChild(baseline);
        const delta=Number.isFinite(it.changeDelta)?it.changeDelta:null;
        const change=cell("div","cg "+(delta>0?"up":delta<0?"down":"flat"),"");
        change.textContent=delta===null?"—":delta===0?"0%":(delta>0?"↑+":"↓")+delta+"%";
        change.title=(it.beforeLabel||"이전")+" 대비 거래소 변동률 변화";
        rates.appendChild(change);
        head.appendChild(rates);
      }
      const premium=typeof it.kimp==="string" && /^[+-]?\d+(?:\.\d+)?%$/.test(it.kimp)?Number(it.kimp.slice(0,-1)):null;
      if(cs.includes("kimp") && Number.isFinite(premium)){
        const kimp=cell("div","cj-toast-metrics","");
        kimp.appendChild(cjToastSeparator());
        kimp.appendChild(cell("div","kp "+(premium>0?"up":premium<0?"down":"flat"),"김프 "+(premium>0?"+":"")+premium+"%"));
        head.appendChild(kimp);
      }
      row.appendChild(head);
      b.appendChild(row);
    }
    clearTimeout(fadeT);
    b.style.transition="none";
    b.style.opacity="0";
    b.style.transform="translateY(-7px) scale(.98)";
    cjGripVisible(false);
  };

  /* ② 창이 뜬 뒤에 부른다 — 창이 숨어 있는 동안에는 프레임이 안 돌아서
        여기서 시작해야 첫 알림도 제대로 스르륵 나타난다 */
  function armFade(){
    const b=bar();
    clearTimeout(fadeT);
    fadeT=setTimeout(()=>{
      b.style.transition="opacity "+OUT_MS+"ms ease-in";
      b.style.opacity="0";                // 안 누르면 서서히 사라진다
      cjGripVisible(false);
    }, durationMs-OUT_MS);
  }
  async function cjFitToast(){
    if(!TW) return;
    const b=bar();
    try{
      const mon=await TW.currentMonitor();
      if(!mon) return;
      const sf=mon.scaleFactor||1;
      const wa=mon.workArea||{position:mon.position,size:mon.size};
      const mx=wa.position.x/sf, my=wa.position.y/sf;
      const mw=wa.size.width/sf, mh=wa.size.height/sf;
      cjToastBounds={width:Math.max(1,mw-16),height:Math.max(1,mh-16)};
      const saved=cjToastSize();
      // 실제 HTML 너비를 재고, 화면 폭을 넘는 경우에만 줄바꿈한다.
      b.style.width="max-content";
      b.style.height="auto";
      const width=Math.min(saved?saved.width:Math.max(240,b.offsetWidth),cjToastBounds.width);
      b.style.width=width+"px";
      const height=Math.min(saved?saved.height:Math.max(54,b.offsetHeight),cjToastBounds.height);
      const x=Math.max(mx+8,Math.min(base.x,mx+mw-width-8));
      const y=Math.max(my+8,Math.min(base.y,my+mh-height-8));
      const w=TW.getCurrentWindow();
      await w.setSize(new TW.LogicalSize(width,height));
      await w.setPosition(new TW.LogicalPosition(x,y));
      base={x,y};
    }catch(e){} finally{
      b.style.width="";
      b.style.height="";
    }
  }
  window.__cjPlay=async function(x,y){
    const seq=toastSeq;
    base={x:Number(x)||0, y:Number(y)||0};
    await cjFitToast();
    if(seq!==toastSeq) return;
    const b=bar(), opa=targetOpa(readUi());
    b.style.transition="opacity "+IN_MS+"ms ease-out, transform "+IN_MS+"ms ease-out";
    b.style.opacity=String(opa);          // 0 → 설정 투명도
    b.style.transform="none";
    cjGripVisible(true);
    armFade();
  };
</script>
